# NodePort Service: opens port 30080 on the cluster node. kind-config.yaml maps
# that to http://localhost:8088 on your Mac. (A real cluster would use an
# Ingress / LoadBalancer with a domain name instead.)
# The same nginx image as docker compose works unchanged: it proxies /api to
# "backend:8080", and "backend" is also the Service name here.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bys
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bys
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      # By default k8s injects env vars for every Service in the namespace, e.g.
      # REDIS_PORT=tcp://10.96.x.x:6379 -- which collides with OUR REDIS_PORT
      # setting (Spring expects a number) and crashes the app. Turn that off.
      enableServiceLinks: false
      containers:
        - name: frontend
          image: bys-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
