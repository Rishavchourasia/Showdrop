# The API. replicas: 2 -> two identical pods behind one Service, which
# load-balances between them. This works ONLY because the backend is stateless:
#   - logins are JWTs (no in-memory sessions)
#   - the cache and seat holds live in Redis, shared by both pods
#   - the data lives in Postgres
# Kill a pod (`kubectl delete pod ...`) and Kubernetes replaces it; the app keeps working.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bys
spec:
  selector: { app: backend }
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bys
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      # By default k8s injects env vars for every Service in the namespace, e.g.
      # REDIS_PORT=tcp://10.96.x.x:6379 -- which collides with OUR REDIS_PORT
      # setting (Spring expects a number) and crashes the app. Turn that off.
      enableServiceLinks: false
      containers:
        - name: backend
          image: bys-backend:local
          imagePullPolicy: Never      # use the image we loaded into kind, don't try a registry
          envFrom:
            - configMapRef: { name: bys-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bys-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: bys-secrets, key: JWT_SECRET } }
          ports:
            - containerPort: 8080
          # startupProbe: give Spring Boot time to boot before the other probes start judging it.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36
          # liveness: "is the process stuck?" -> if failing, k8s RESTARTS the pod.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          # readiness: "can it serve traffic now?" -> if failing, k8s stops SENDING requests to it.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
