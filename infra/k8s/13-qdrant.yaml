# The vector database for the AI agent's RAG. A StatefulSet with its own disk,
# like Postgres. (Its contents can always be rebuilt with POST /agent/reindex.)
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: bys
spec:
  selector: { app: qdrant }
  ports:
    - port: 6333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: bys
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.0
          ports:
            - containerPort: 6333
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /qdrant/storage }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
