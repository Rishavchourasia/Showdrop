# Postgres as a StatefulSet: like a Deployment, but each pod keeps a stable name
# and its OWN persistent disk (PersistentVolumeClaim) that survives restarts.
# That's what databases need. (In production you'd often use a managed DB instead.)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bys
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bys
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: bys }
            - { name: POSTGRES_USER, value: bys }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: bys-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "bys", "-d", "bys"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
