# ---------------------------------------------------------------------------
# One command runs the whole system:   docker compose up --build
#
#   browser --> frontend (nginx :3000) --/api--> backend (:8080) --> postgres
#                  |                                |  |---------> redis
#                  |                                '--> kafka --> notifications
#                  '--/agent--> ai-agent (:8000) --> qdrant (vectors), redis (chat memory),
#                                                    backend (tools), LLM API
#
# Compose puts every service on a private network where they reach each other
# by SERVICE NAME (postgres, redis, kafka, backend). "ports" publishes a port to
# your Mac as  "HOST:CONTAINER".
# ---------------------------------------------------------------------------
name: bys

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bys
      POSTGRES_USER: bys
      POSTGRES_PASSWORD: bys
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # a named volume keeps data when containers are recreated
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bys -d bys"]
      interval: 5s
      timeout: 3s
      retries: 20

  # PHASE 4
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # PHASE 5 -- Kafka in KRaft mode (no ZooKeeper needed). One broker is enough to learn with.
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners because clients reach Kafka by different addresses:
      #   containers use kafka:29092; tools on your Mac use localhost:9092.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bys
      DB_USER: bys
      DB_PASSWORD: bys
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-compose-dev-secret-change-me-compose-dev-secret-change-me}
    # Don't start until the dependencies are actually READY (healthchecks pass), not just started.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # PHASE 5 -- separate service, only talks to Kafka.
  notifications:
    build: ./notifications
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka: { condition: service_healthy }

  # AI AGENT -- the vector database that powers RAG. Dashboard: http://localhost:6333/dashboard
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  # AI AGENT -- Python/FastAPI service: LLM + tools + RAG. API docs: http://localhost:8000/docs
  ai-agent:
    build: ./ai-agent
    ports:
      - "8000:8000"
    # Reads LLM_API_KEY and AGENT_MODEL from the .env file next to this compose file (see .env.example).
    # Empty is allowed: everything works except the chat replies themselves.
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      BACKEND_URL: http://backend:8080
      QDRANT_URL: http://qdrant:6333
      REDIS_HOST: redis
    depends_on:
      qdrant: { condition: service_started }
      redis: { condition: service_healthy }
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/agent/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend: { condition: service_healthy }
      ai-agent: { condition: service_healthy }   # nginx needs the "ai-agent" hostname to exist at startup

volumes:
  pgdata:
  qdrantdata:
