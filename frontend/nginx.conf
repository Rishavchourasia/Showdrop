# nginx does two jobs here:
#  1. serves the built React files
#  2. acts as a REVERSE PROXY: requests to /api/* are forwarded to the backend.
#     The browser only ever talks to ONE origin (this nginx), so there are no
#     CORS problems, and the backend doesn't need to be exposed publicly.
server {
    listen 80;
    root /usr/share/nginx/html;

    # "backend" is the service name. Docker Compose and Kubernetes both provide
    # DNS so containers can find each other by name.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The Python AI agent service.
    location /agent/ {
        proxy_pass http://ai-agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # an agent turn can take a while (several model + tool calls)
    }

    # Single-page app: for any unknown path (e.g. /shows/3 on refresh), serve
    # index.html and let React Router decide what to show.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS filenames contain a content hash, so they can be cached "forever".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
