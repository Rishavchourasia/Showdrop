# ---------------------------------------------------------------------------
# Application configuration.
#
# WHY the ${NAME:default} syntax? It means "use environment variable NAME if it
# exists, otherwise use the default". The defaults work when you run the app on
# your Mac (everything on localhost). Docker / Kubernetes override them with
# env vars (e.g. DB_URL=jdbc:postgresql://postgres:5432/bys) -- same jar,
# different environment, no code changes. This is the "12-factor app" idea.
# ---------------------------------------------------------------------------
server:
  port: ${PORT:8080}

spring:
  application:
    name: bys-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bys}
    username: ${DB_USER:bys}
    password: ${DB_PASSWORD:bys}

  jpa:
    # "validate" = Hibernate checks our @Entity classes match the tables, but never
    # changes the schema itself. Flyway owns the schema; Hibernate just uses it.
    hibernate:
      ddl-auto: validate
    # WHY false? "Open session in view" keeps a DB connection open while JSON is
    # being written, hiding lazy-loading bugs and wasting connections. Turning it
    # off forces us to load everything we need inside the service layer.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # ---- PHASE 4: Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ---- PHASE 5: Kafka ----
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Don't stamp Java class names into message headers. The consumer is a
        # different service with its own classes, so it should rely on the JSON
        # shape only -- not on our package names.
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # adds /actuator/health/liveness and /readiness for Kubernetes

app:
  jwt:
    # The secret used to SIGN tokens. Anyone who knows it can forge logins, so in
    # real deployments it comes from a secret store. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  booking:
    # PHASE 4: how long seats are held while the user "pays".
    hold-minutes: ${BOOKING_HOLD_MINUTES:5}
  drops:
    # Demo: on startup, re-schedule every drop to open this many seconds later.
    demo-reset-on-start: ${DROPS_DEMO_RESET:true}
    demo-delay-seconds: ${DROPS_DEMO_DELAY:120}
  demo-user:
    # A ready-made account so you can try the app without signing up.
    email: demo@bys.dev
    password: demo1234
    full-name: Demo User

logging:
  level:
    com.bys: INFO
