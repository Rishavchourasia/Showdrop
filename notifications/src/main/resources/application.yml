server:
  port: ${PORT:8081}

spring:
  application:
    name: bys-notifications
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # A consumer GROUP shares the work: if we ran 3 copies of this service with
      # the same group-id, Kafka would split the topic's partitions among them,
      # so each message is handled by exactly ONE copy.
      group-id: notifications-service
      # First time this group ever connects: start from the oldest message
      # ("earliest") instead of only new ones. Nothing confirmed is ever missed.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps the JSON one, so ONE malformed message
      # gets logged and skipped instead of crashing the consumer in a loop.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Read the JSON into OUR class. We don't share Java code with the backend --
        # only the JSON shape (the "contract").
        spring.json.value.default.type: com.bys.notifications.BookingConfirmedMessage
        spring.json.use.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
